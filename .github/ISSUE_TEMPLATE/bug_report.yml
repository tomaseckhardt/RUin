name: Nahlášení chyby (česky)
description: Nahlásit chybu, která se dá reprodukovat
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Děkujeme za report. Čím přesněji problém popíšeš, tím rychleji ho opravíme.

  - type: textarea
    id: summary
    attributes:
      label: Stručný popis chyby
      description: Co je rozbité a co jsi čekal(a), že se stane.
      placeholder: Po odeslání RSVP se nezobrazí seznam účastníků...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Kroky k reprodukci
      description: Napiš postup krok za krokem.
      placeholder: |
        1. Otevřu detail akce
        2. Vyplním formulář
        3. Kliknu na "Potvrzuji účast"
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Očekávané chování
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Aktuální chování
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Prohlížeč / verze
      placeholder: Chrome 137, Firefox 131, Safari...

  - type: input
    id: environment
    attributes:
      label: Prostředí
      description: Lokál, GitHub Pages, jiná instance...

  - type: textarea
    id: logs
    attributes:
      label: Logy / screenshoty
      description: Vlož stack trace, konzoli nebo obrázek.
