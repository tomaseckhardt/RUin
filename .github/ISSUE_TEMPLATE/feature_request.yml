name: Návrh na vylepšení (česky)
description: Navrhnout vylepšení funkcionality
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Máš nápad, jak RUin zlepšit? Super, sem s ním.

  - type: textarea
    id: problem
    attributes:
      label: Jaký problém to řeší?
      description: Co je dnes nepříjemné, pomalé nebo nejasné.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Navržené řešení
      description: Jak by podle tebe měla nová funkcionalita fungovat.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Zvážené alternativy
      description: Pokud jsi zvážil(a) jiné cesty, popiš je.

  - type: textarea
    id: impact
    attributes:
      label: Dopad na uživatele
      description: Komu to pomůže a proč je to důležité.
